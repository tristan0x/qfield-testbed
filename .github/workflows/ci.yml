name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run the Docker integration tests
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1" # weekly integration run

permissions:
  contents: read

# a new push to a pull request supersedes the run still going for the previous one
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: pre-commit (ruff, mypy, pyright, vulture, deptry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: SKIP=no-commit-to-branch uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --python ${{ matrix.python }}
      # the coverage threshold is `fail_under` in pyproject.toml; Hypothesis explores more examples than locally
      - run: uv run pytest --cov --cov-report=term-missing
        env:
          HYPOTHESIS_PROFILE: ci
      - name: Coverage summary
        if: always() && matrix.python == '3.12'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: integration (docker)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.integration)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # two QFieldCloud release image sets weigh about 20 GB: make room by dropping toolchains the tests never use
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: QFT_INTEGRATION=1 uv run pytest -m docker -o addopts="" -v --durations=0
        env:
          GH_TOKEN: ${{ github.token }}
