kind: scenario
description: UC4 — any QGIS plugin loaded in an isolated profile, its startup checked headless.
checkout: {fixture: qgis-plugin, remote: "https://github.com/opengisch/qgis-swiss-locator.git"}
prompt: >-
  Check that this QGIS plugin loads in a clean QGIS profile without errors, and report what QGIS says about it.
  Don't touch my own QGIS profile, and clean up afterwards.
max_turns: 50
max_minutes: 25
expect:
  skill: true
  commands_in_order: ["qft .*deployment ensure", "qft .*deployment (run|logs)", "qft .*deployment remove"]
  never: ["--force"]
  deployment: {qgis: "."}
  final_contains: ["swiss|locator|plugin"]
